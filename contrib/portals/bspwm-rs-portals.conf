# xdg-desktop-portal configuration for bspwm-rs.
#
# Install as ~/.config/xdg-desktop-portal/bspwm-rs-portals.conf (the file name
# is "<XDG_CURRENT_DESKTOP>-portals.conf"; bspwm-rs exports
# XDG_CURRENT_DESKTOP=bspwm-rs itself unless it is already set).
#
# Screenshots and screen casting use xdg-desktop-portal-wlr, which talks to
# bspwm-rs's wlr-screencopy; file choosers, settings etc. fall back to the GTK
# portal. Start the portals after the compositor, e.g. from bspwmrc:
#   dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#   /usr/lib/xdg-desktop-portal-wlr &
#   /usr/lib/xdg-desktop-portal &
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
