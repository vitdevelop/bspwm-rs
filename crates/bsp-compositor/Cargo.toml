[package]
name = "bsp-compositor"
description = "The Wayland compositor binary (bspwm-rs): rendering, input, outputs, protocols, XWayland."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bspwm-rs"
path = "src/main.rs"

[dependencies]
libc = "0.2"
bsp-core = { path = "../bsp-core" }
bsp-ipc = { path = "../bsp-ipc" }
bsp-hotkeys = { path = "../bsp-hotkeys" }
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "xwayland",
] }
# Not used directly — this only turns on calloop's own "signals" feature
# (SIGUSR1 sxhkdrc reload, `docs/bsp-hotkeys.md`) for the version
# `smithay::reexports::calloop` already resolves to; every calloop type
# this crate uses still goes through that reexport, never this crate
# directly.
calloop = { version = "0.14", default-features = false, features = [
    "signals",
] }
# Server-side bindings for the protocols Smithay does not implement itself
# (protocols): the wlr family (foreign-toplevel-management, screencopy,
# output-management, gamma-control, virtual-pointer) and the staging
# `ext-workspace-v1`. Both use the same `wayland-server` as Smithay.
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
# Reads a panel's `_NET_WM_STRUT_PARTIAL` and counts the X clients (`res`) from
# Xwayland (`crate::xwayland`); the same version Smithay's own X11 window
# manager uses.
x11rb = { version = "0.13", features = ["res"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xkbcommon = "0.8"
# Decodes the xcursor theme's default cursor (`crate::cursor`); already in
# the tree via smithay.
xcursor = "0.3"
# Connector hotplug scanning (`DrmScanner`) for the `real` backend — a
# separate crate from `smithay` itself, published independently
# (confirmed via `anvil/Cargo.toml`, Smithay's own reference compositor,
# `docs/bsp-compositor.md` Hardware backend progress). Optional: only pulled in
# by the `real` feature, so a `nested`-only build never needs it.
# `default-features = false` skips its own `display-info` feature (make/
# model strings via the system `libdisplay-info` library, unused here —
# `docs/design.md`'s Compatibility section only ever needs a connector's
# *name*, e.g. `HDMI-A-1`, not its make/model) — this system's installed
# `libdisplay-info` (0.3.0) is newer than that feature's own dependency
# will accept (`< 0.3.0`) anyway, so enabling it would fail to build.
smithay-drm-extras = { version = "0.1", optional = true, default-features = false }
# Raw DRM ioctls the `drm` crate wraps too narrowly: creating a property
# blob of runtime size (the gamma LUT, `crate::gamma`). Same version `drm` uses.
drm-ffi = { version = "0.9", optional = true }

[dev-dependencies]
# For `examples/protocol_probe.rs`, the tiny Wayland client used to
# live-test protocols in the QEMU VM.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs", "time", "process"] }
# `examples/golden_record.rs` reads bspwm's `query -T` output.
serde_json = "1"

[[example]]
name = "capture_probe"
required-features = ["real"]

[features]
default = ["nested"]
# The nested (winit) backend used for development, kept out of release
# builds (`docs/design.md`, Performance budget).
nested = ["smithay/backend_winit"]
# The real hardware backend (DRM/KMS/libseat/udev/libinput), the hardware backend
# (`docs/design.md` roadmap) — mutually exclusive with `nested` for now
# (`main.rs`'s `compile_error!`): `real` has its own `State<DrmData>`,
# and nothing yet needs both backends compiled into the same binary.
# Deliberately *not* included, unlike Smithay's own anvil reference
# compositor (`docs/bsp-compositor.md` Hardware backend progress for the full
# reasoning): DRM leasing (`backend_drm_lease`/`wayland_drm_lease`, VR
# headset passthrough), explicit sync (`wayland_drm_syncobj`), and
# Vulkan (`backend_vulkan`, anvil's optional renderer, this project
# already has one via `renderer_gl`).
real = [
    "dep:smithay-drm-extras",
    "dep:drm-ffi",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_egl",
    "smithay/use_system_lib",
    "smithay/renderer_multi",
]
