[package]
name = "bsp-compositor"
description = "The Wayland compositor binary (bspwm-rs): rendering, input, outputs, protocols, XWayland."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bspwm-rs"
path = "src/main.rs"

[dependencies]
bsp-core = { path = "../bsp-core" }
bsp-ipc = { path = "../bsp-ipc" }
bsp-hotkeys = { path = "../bsp-hotkeys" }
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
] }
# Not used directly — this only turns on calloop's own "signals" feature
# (SIGUSR1 sxhkdrc reload, `docs/bsp-hotkeys.md`) for the version
# `smithay::reexports::calloop` already resolves to; every calloop type
# this crate uses still goes through that reexport, never this crate
# directly.
calloop = { version = "0.14", default-features = false, features = [
    "signals",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xkbcommon = "0.8"

[features]
default = ["nested"]
# The nested (winit) backend used for development, kept out of release
# builds (`docs/design.md`, Performance budget).
nested = ["smithay/backend_winit"]
