[package]
name = "bsp-hotkeys"
description = "Bundled sxhkdrc-compatible parser and chord matcher (hotkeys and config)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Keysym *name* lookup only (`xkb::keysym_from_name`) — no `Context`,
# `Keymap` or `State` here; those need a live keyboard mapping, which is
# `bsp-compositor`'s job (`docs/design.md` Architecture).
xkbcommon = "0.8"

[dev-dependencies]
proptest = "1"
